[package]
name = "gyliber-command-center"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["form"] }
oauth2 = { version = "5.0", default-features = false }
oauth2-reqwest = "0.1.0-alpha.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "time"] }
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["fs", "limit", "trace", "set-header", "request-id"] }
tower-sessions = { version = "0.15.0", features = ["private"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
