name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playground:
    name: Mathematical playground
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: math-playground/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: math-playground
      - run: npm audit --audit-level=high
        working-directory: math-playground
      - run: npm test
        working-directory: math-playground
        env:
          CURATED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npx playwright install --with-deps chromium
        working-directory: math-playground
      - run: npm run test:browser
        working-directory: math-playground
        env:
          PLAYGROUND_SCREENSHOT_DIR: ${{ github.workspace }}/test-results/playground
      - uses: actions/upload-artifact@v7
        with:
          name: playground-visual-review
          path: test-results/playground/*.png
          retention-days: 7
          if-no-files-found: error

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build locked production image
        run: docker build --tag gyliber-command-center:ci .
      - name: Verify production startup and PostgreSQL migration
        run: bash scripts/verify-container.sh gyliber-command-center:ci

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gyliber_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gyliber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gyliber_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Advisory audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
