name: Bootstrap Cargo Lockfile

on:
  push:
    branches:
      - chore/bootstrap-cargo-lock

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Commit Cargo.lock
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1 && git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: generate Cargo lockfile"
          git push origin HEAD:chore/bootstrap-cargo-lock
